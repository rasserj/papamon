<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16231b">
<title>PapaMon v0.2.3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <!-- Selection view -->
  <section id="select">
    <h1>PapaMon</h1>
    <p class="sub">Choisis ton compagnon</p>
    <div id="starters"></div>
    <p class="hint">v0.2.3 · exploration & combat</p>
  </section>

  <!-- Exploration Map view -->
  <section id="map" hidden>
    <h1>Campagne</h1>
    <p class="sub">Déplace-toi avec les flèches ou le pavé tactile</p>
    <div class="map-container">
      <canvas id="mapCanvas"></canvas>
    </div>
    <div class="controls">
      <div class="dpad-row">
        <button type="button" class="dpad-btn" data-dir="up" aria-label="Haut">▲</button>
      </div>
      <div class="dpad-row">
        <button type="button" class="dpad-btn" data-dir="left" aria-label="Gauche">◀</button>
        <button type="button" class="dpad-btn" data-dir="down" aria-label="Bas">▼</button>
        <button type="button" class="dpad-btn" data-dir="right" aria-label="Droite">▶</button>
      </div>
    </div>
    <p class="hint">Traverse les hautes herbes pour rencontrer des compagnons sauvages !</p>
  </section>

  <!-- Battle view -->
  <section id="battle" hidden>
    <div class="arena">
      <div class="row foe">
        <div class="card"><span class="name" id="foeName"></span><span class="quality-badge" id="foeQuality"></span><span class="type" id="foeType"></span>
          <div class="bar"><i id="foeBar"></i></div><small id="foeHp"></small></div>
        <div id="foeSprite"></div>
      </div>
      <div class="row me">
        <div id="meSprite"></div>
        <div class="card"><span class="name" id="meName"></span><span class="quality-badge" id="meQuality"></span><span class="type" id="meType"></span>
          <div class="bar"><i id="meBar"></i></div><small id="meHp"></small></div>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="moves"></div>
    <div id="battleActions" class="battle-actions"></div>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
