<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16231b">
<title>PapaMon</title>
<style>
  :root { --bg:#16231b; --panel:#1f3326; --ink:#e8f1e4; --muted:#9db8a2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; }
  main { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section[hidden] { display: none; }
  h1 { text-align: center; margin: 8px 0 4px; font-size: 2.2rem; }
  .sub, .hint { text-align: center; color: var(--muted); margin: 4px 0 16px; }
  .hint { margin-top: auto; font-size: .85rem; }
  button { font: inherit; font-weight: 600; color: var(--ink); background: #2f5a3a; border: 0;
    border-radius: 10px; min-height: 56px; padding: 8px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:active:not(:disabled) { transform: scale(.97); }
  button small { display: block; font-weight: 400; color: var(--muted); }
  #starters { display: grid; gap: 10px; }
  #starters button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px 14px; }
  #starters .sprite { width: 64px; flex: none; }
  .sprite { image-rendering: pixelated; aspect-ratio: 1; width: min(34vw, 140px); }
  .arena { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 8px;
    border-radius: 12px; background: linear-gradient(#2b4a33, #1c3a26); padding: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .me .sprite { transform: scaleX(-1); }
  .card { flex: 1; background: rgba(13,22,16,.7); border-radius: 10px; padding: 8px 10px; }
  .card .name { font-weight: 700; }
  .card .type { color: var(--muted); font-size: .85rem; margin-left: 6px; }
  .bar { height: 10px; margin: 6px 0 4px; background: #0d1610; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #6fcf7f;
    transition: width .5s, background .5s; }
  .card small { color: var(--muted); }
  .hit { animation: blink .35s 2; }
  @keyframes blink { 50% { opacity: .15; } }
  #msg { min-height: 3.4em; background: var(--panel); border-radius: 10px; padding: 10px 12px;
    margin: 8px 0; line-height: 1.35; }
  #moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #moves .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<main>
  <section id="select">
    <h1>PapaMon</h1>
    <p class="sub">Choisis ton compagnon</p>
    <div id="starters"></div>
    <p class="hint">v0.1 · prototype de combat</p>
  </section>

  <section id="battle" hidden>
    <div class="arena">
      <div class="row foe">
        <div class="card"><span class="name" id="foeName"></span><span class="type" id="foeType"></span>
          <div class="bar"><i id="foeBar"></i></div><small id="foeHp"></small></div>
        <div id="foeSprite"></div>
      </div>
      <div class="row me">
        <div id="meSprite"></div>
        <div class="card"><span class="name" id="meName"></span><span class="type" id="meType"></span>
          <div class="bar"><i id="meBar"></i></div><small id="meHp"></small></div>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="moves"></div>
  </section>
</main>

<script>
'use strict';

/* ============ DONNÉES (à déplacer plus tard dans /data en JSON) ============ */

// Efficacité : « strong » = type battu (x1,5), « weak » = type qui résiste (x0,5)
const TYPES = {
  sylve:  { label: 'Sylve',  strong: 'flot',   weak: 'braise' },
  braise: { label: 'Braise', strong: 'sylve',  weak: 'flot'   },
  flot:   { label: 'Flot',   strong: 'braise', weak: 'sylve'  },
};

const MOVES = {
  charge:    { name: 'Charge',        type: null,     power: 35, acc: 100 },
  fouet:     { name: 'Fouet-liane',   type: 'sylve',  power: 50, acc: 90 },
  etincelle: { name: 'Étincelle',     type: 'braise', power: 50, acc: 90 },
  jet:       { name: 'Jet d’eau',     type: 'flot',   power: 50, acc: 90 },
};

const CREATURES = [
  { name: 'Mousselin', type: 'sylve',  hp: 44, atk: 12, spd: 9,  top: 'sprout', colors: ['#4caf50', '#a5e08a'], moves: ['charge', 'fouet'] },
  { name: 'Cendrille', type: 'braise', hp: 40, atk: 14, spd: 11, top: 'flame',  colors: ['#e8643c', '#ffd36b'], moves: ['charge', 'etincelle'] },
  { name: 'Gouttelin', type: 'flot',   hp: 46, atk: 11, spd: 10, top: 'drop',   colors: ['#3f8fe0', '#9fd8ff'], moves: ['charge', 'jet'] },
];

/* ============ SPRITES 16x16 (k = contour, w = blanc, g = couleur, G = clair) ============ */
// Provisoires : un corps commun + un sommet propre à chaque créature.

const TOPS = {
  sprout: [
    '................',
    '.......kk.......',
    '......kGGk......',
    '.......kGk......',
    '....kkkkkkkk....',
  ],
  flame: [
    '................',
    '.......kk.......',
    '......kGGk......',
    '.....kGggGk.....',
    '....kkkggkkk....',
  ],
  drop: [
    '................',
    '.......kk.......',
    '......kGGk......',
    '.....kGGGGk.....',
    '....kkkkkkkk....',
  ],
};

const BODY = [
  '..kggggggggggk..',
  '.kggggggggggggk.',
  '.kggwkggggkwggk.',
  '.kggwkggggkwggk.',
  '.kggggggggggggk.',
  '.kgGgggkkgggGgk.',
  '..kggggggggggk..',
  '...kkggggggkk...',
  '....kkkkkkkk....',
  '................',
  '................',
];

function makeSprite(c) {
  const cv = document.createElement('canvas');
  cv.width = 16; cv.height = 16; cv.className = 'sprite';
  const ctx = cv.getContext('2d');
  const pal = { k: '#14201a', w: '#ffffff', g: c.colors[0], G: c.colors[1] };
  [...TOPS[c.top], ...BODY].forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch !== '.') { ctx.fillStyle = pal[ch]; ctx.fillRect(x, y, 1, 1); }
    });
  });
  return cv;
}

/* ============ OUTILS ============ */

const $ = (s) => document.querySelector(s);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const say = (t) => { $('#msg').textContent = t; };

function typeMult(moveType, defType) {
  if (!moveType) return 1;
  if (TYPES[moveType].strong === defType) return 1.5;
  if (TYPES[moveType].weak === defType) return 0.5;
  return 1;
}

/* ============ ÉTAT DU COMBAT ============ */

let me, foe, busy = true;

function showSelect() {
  $('#battle').hidden = true;
  $('#select').hidden = false;
}

function buildSelect() {
  const box = $('#starters');
  CREATURES.forEach((c) => {
    const b = document.createElement('button');
    b.appendChild(makeSprite(c));
    const t = document.createElement('div');
    t.innerHTML = `${c.name}<small>Type ${TYPES[c.type].label} · PV ${c.hp}</small>`;
    b.appendChild(t);
    b.addEventListener('click', () => startBattle(c));
    box.appendChild(b);
  });
}

function fighter(base) { return { base, hp: base.hp }; }

function updateBars() {
  [['me', me], ['foe', foe]].forEach(([id, f]) => {
    const pct = Math.round((f.hp / f.base.hp) * 100);
    const bar = $('#' + id + 'Bar');
    bar.style.width = pct + '%';
    bar.style.background = pct > 50 ? '#6fcf7f' : pct > 20 ? '#f0b84a' : '#e5594f';
    $('#' + id + 'Hp').textContent = `PV ${f.hp}/${f.base.hp}`;
  });
}

function setMoveButtons(enabled) {
  document.querySelectorAll('#moves button').forEach((b) => { b.disabled = !enabled; });
}

async function startBattle(base) {
  me = fighter(base);
  foe = fighter(pick(CREATURES));
  $('#select').hidden = true;
  $('#battle').hidden = false;

  [['me', me], ['foe', foe]].forEach(([id, f]) => {
    $('#' + id + 'Name').textContent = f.base.name;
    $('#' + id + 'Type').textContent = TYPES[f.base.type].label;
    const slot = $('#' + id + 'Sprite');
    slot.replaceChildren(makeSprite(f.base));
  });
  updateBars();

  const box = $('#moves');
  box.replaceChildren();
  me.base.moves.forEach((id) => {
    const m = MOVES[id];
    const b = document.createElement('button');
    b.innerHTML = `${m.name}<small>${m.type ? TYPES[m.type].label : 'Normal'} · puissance ${m.power}</small>`;
    b.addEventListener('click', () => playTurn(id));
    box.appendChild(b);
  });
  setMoveButtons(false);

  busy = true;
  say(`${foe.base.name} sauvage apparaît !`);
  await wait(1200);
  say(`Que doit faire ${me.base.name} ?`);
  setMoveButtons(true);
  busy = false;
}

async function attack(att, def, move, defSlot) {
  say(`${att.base.name} utilise ${move.name} !`);
  await wait(800);
  if (Math.random() * 100 > move.acc) {
    say('Mais ça rate !');
    await wait(900);
    return;
  }
  const mult = typeMult(move.type, def.base.type);
  const dmg = Math.max(1, Math.round(move.power * att.base.atk / 50 * mult * (0.85 + Math.random() * 0.15)));
  const sprite = $('#' + defSlot + 'Sprite');
  sprite.classList.add('hit');
  def.hp = Math.max(0, def.hp - dmg);
  updateBars();
  await wait(700);
  sprite.classList.remove('hit');
  if (mult > 1) { say('C’est très efficace !'); await wait(900); }
  else if (mult < 1) { say('Ce n’est pas très efficace…'); await wait(900); }
}

async function playTurn(moveId) {
  if (busy) return;
  busy = true;
  setMoveButtons(false);
  const pMove = MOVES[moveId];
  const fMove = MOVES[pick(foe.base.moves)];
  const playerFirst = me.base.spd > foe.base.spd || (me.base.spd === foe.base.spd && Math.random() < 0.5);
  const order = playerFirst
    ? [[me, foe, pMove, 'foe'], [foe, me, fMove, 'me']]
    : [[foe, me, fMove, 'me'], [me, foe, pMove, 'foe']];

  for (const [a, d, m, slot] of order) {
    await attack(a, d, m, slot);
    if (d.hp <= 0) { await endBattle(a === me, d); return; }
  }
  say(`Que doit faire ${me.base.name} ?`);
  setMoveButtons(true);
  busy = false;
}

async function endBattle(playerWon, loser) {
  say(`${loser.base.name} est K.O. !`);
  await wait(1100);
  say(playerWon ? 'Victoire ! Bravo !' : 'Défaite… ce sera pour la prochaine fois.');
  const box = $('#moves');
  box.replaceChildren();
  const b = document.createElement('button');
  b.className = 'full';
  b.textContent = 'Rejouer';
  b.addEventListener('click', showSelect);
  box.appendChild(b);
  b.focus();
}

// Clavier (PC) : touches 1, 2… pour choisir une attaque
document.addEventListener('keydown', (e) => {
  if ($('#battle').hidden) return;
  const btns = [...document.querySelectorAll('#moves button')];
  const i = parseInt(e.key, 10) - 1;
  if (btns[i] && !btns[i].disabled) btns[i].click();
});

buildSelect();
</script>
</body>
</html>
